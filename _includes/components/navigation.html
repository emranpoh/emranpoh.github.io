{% assign current_page = page.url | split: '/' | last %}
{% assign current_section = page.url | split: '/' | slice: 1, 1 | first %}

<div class="nav-links-section nav-buttons">
  <div class="nav-links-grid">
    <div class="nav-left">
      <a href="{{ '/' | relative_url }}" class="nav-link nav-link-with-text {% if page.url == '/' or page.url == '' %}active{% endif %}">
        <span class="nav-link-text">about</span>
      </a>
      <a href="{{ '/publications/' | relative_url }}" class="nav-link nav-link-with-text {% if page.url == '/publications/' or page.url == '/publications' %}active{% endif %}">
        <span class="nav-link-text">publications</span>
      </a>
    </div>
    <div class="nav-right">
      <!-- Desktop Socials -->
      <span class="nav-socials-desktop">
        <a href="https://github.com/{{ site.github_username }}" target="_blank" rel="noopener noreferrer" class="nav-link" aria-label="GitHub profile"><i class="fab fa-github" aria-hidden="true"></i></a>
        <a href="https://linkedin.com/in/{{ site.linkedin_username }}" target="_blank" rel="noopener noreferrer" class="nav-link" aria-label="LinkedIn profile"><i class="fab fa-linkedin" aria-hidden="true"></i></a>
        <a href="https://scholar.google.com/citations?user={{ site.scholar_id }}" target="_blank" rel="noopener noreferrer" class="nav-link" aria-label="Google Scholar profile"><img src="{{ '/assets/images/scholar.svg' | relative_url }}" alt="" style="width: 1.25rem; height: 1.25rem;"></a>
        <a href="https://orcid.org/{{ site.orcid_id }}" target="_blank" rel="noopener noreferrer" class="nav-link" aria-label="ORCID profile"><i class="fab fa-orcid" aria-hidden="true"></i></a>
      </span>
      <!-- Mobile Socials -->
      <span class="nav-socials-mobile">
        <a href="https://github.com/{{ site.github_username }}" target="_blank" rel="noopener noreferrer" class="nav-link" aria-label="GitHub profile"><i class="fab fa-github" aria-hidden="true"></i></a>
        <a href="https://linkedin.com/in/{{ site.linkedin_username }}" target="_blank" rel="noopener noreferrer" class="nav-link" aria-label="LinkedIn profile"><i class="fab fa-linkedin" aria-hidden="true"></i></a>
        <a href="https://scholar.google.com/citations?user={{ site.scholar_id }}" target="_blank" rel="noopener noreferrer" class="nav-link" aria-label="Google Scholar profile"><img src="{{ '/assets/images/scholar.svg' | relative_url }}" alt="" style="width: 1.25rem; height: 1.25rem;"></a>
        <a href="https://orcid.org/{{ site.orcid_id }}" target="_blank" rel="noopener noreferrer" class="nav-link" aria-label="ORCID profile"><i class="fab fa-orcid" aria-hidden="true"></i></a>
      </span>
    </div>
  </div>
</div>

<style>
.nav-socials-mobile { 
  display: none; 
  gap: 0.75rem;
}
.nav-socials-desktop { 
  display: flex; 
  gap: 0.75rem;
}

.desktop-top-nav {
  max-width: 100%;
  margin: 0;
  width: 100%;
}
@media (max-width: 768px) {
  .nav-socials-mobile { 
    display: flex !important; 
    gap: 0.75rem;
  }
  .nav-socials-desktop { display: none !important; }
}
.nav-buttons {
  display: flex;
  justify-content: space-between;
  align-items: center;
  width: 100%;
  /* padding: 1rem 0; */
  margin-bottom: 1rem;
}

.nav-links-grid {
  display: flex;
  justify-content: space-between;
  align-items: center;
  width: 100%;
}

.nav-left {
  display: flex;
  gap: 0.75rem;
  align-items: center;
}

.nav-right {
  display: flex;
  gap: 0.75rem;
  align-items: center;
  margin-left: auto;
}

.nav-right .nav-link {
  background: transparent !important;
}

.nav-right .nav-link:hover,
.nav-right .nav-link.active {
  background: transparent !important;
}

.nav-link {
  display: flex;
  align-items: center;
  justify-content: center;
  width: 2.5rem;
  height: 2.5rem;
  background: #e5e7eb;
  border-radius: 0.5rem;
  color: #444 !important;
  font-size: 1.25rem;
  transition: background 0.2s, color 0.2s;
  text-decoration: none;
  gap: 0.5rem;
  padding: 0 0.75rem;
}

.nav-link-with-text {
  width: auto;
  background: transparent !important;
}

.nav-link-with-text:hover {
  background: transparent !important;
}

.nav-link-with-text.active {
  background: transparent !important;
}

.nav-link-text {
  font-size: 1rem;
  font-weight: 400;
  text-transform: lowercase;
}

.nav-link:hover {
  background: #d1d5db;
  color: #222 !important;
}

.nav-link.active {
  background: #d1d5db;
  color: #000 !important;
}

.nav-button {
  padding: 0.5rem 1rem;
  margin: 0 0.5rem;
  text-decoration: none;
  color: #333;
  font-weight: 500;
  transition: all 0.3s ease;
  border-radius: 0.25rem;
}

.nav-button:hover {
  background: #f5f5f5;
}

.nav-button.active {
  background: #333;
  color: white;
}

/* Mobile-specific styles */
@media (max-width: 768px) {
  .nav-buttons {
    margin-bottom: 0;
    background: white;
    padding: 0.75rem 1rem;
    border-radius: 0.5rem;
  }
  
  .nav-link {
    width: 2.5rem;
    height: 2.5rem;
    font-size: 1.25rem;
    padding: 0;
  }
  
  .nav-link-with-text {
    width: 2.5rem;
  }
  
  .nav-link-text {
    display: none;
  }
  
  .nav-left, .nav-right {
    gap: 1rem;
  }
  
  .nav-left .nav-link-text {
    display: inline;
  }
  
  .nav-right {
    order: 1;
  }
}
</style>
