{% unless page.url == '/' or page.id == 'landing' %}
<nav class="top-back-nav" aria-label="Back to homepage">
  <a href="{{ '/' | relative_url }}" class="back-home-link">← homepage</a>
</nav>
{% endunless %}

<style>
.top-back-nav {
  position: sticky;
  top: 0;
  z-index: 50;
  display: flex;
  align-items: center;
  padding: 1rem 2rem;
  background: transparent;
}

.back-home-link {
  display: inline-flex;
  align-items: center;
  gap: 0.375rem;
  font-size: 0.9375rem;
  color: #444;
  text-decoration: none;
  text-transform: lowercase;
  cursor: crosshair;
  transition: color 0.2s;
}

.back-home-link:hover {
  color: #000;
}

@media (max-width: 768px) {
  .top-back-nav {
    padding: 0.75rem 1rem;
  }
  .back-home-link {
    font-size: 0.875rem;
  }
}
</style>
