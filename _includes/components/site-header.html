<header class="site-header" id="site-header">
  <div class="site-header-inner">
    <div class="site-header-left">
      <a href="{{ '/' | relative_url }}" class="site-logo" aria-label="{{ site.title }} — home">
        <span class="site-logo-mark">{{ site.title }}</span>
      </a>
    </div>

    <div class="site-header-right">
      <nav class="site-header-icons" aria-label="Quick links">
        <button type="button" class="site-theme-toggle" id="site-theme-toggle" aria-label="Toggle dark mode" aria-pressed="false">
          <svg class="site-theme-icon site-theme-icon-sun" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></svg>
          <svg class="site-theme-icon site-theme-icon-moon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"/></svg>
        </button>
        <a href="https://www.dropbox.com/scl/fi/xfo54s6kqvcm4xc50murf/emran-cv.pdf?rlkey=xfrgl82y00ojdcz8qd9hwkt1q&dl=0" target="_blank" rel="noopener noreferrer" class="site-cv-link" aria-label="CV (PDF)">cv</a>
        <a href="https://linkedin.com/in/{{ site.linkedin_username }}" target="_blank" rel="noopener noreferrer" class="site-icon-link" aria-label="LinkedIn">
          {% include icon.html name="linkedin" %}
        </a>
        <a href="https://scholar.google.com/citations?user={{ site.scholar_id }}" target="_blank" rel="noopener noreferrer" class="site-icon-link site-icon-link-img" aria-label="Google Scholar">
          <img src="{{ '/assets/images/scholar.svg' | relative_url }}" alt="" class="site-icon-img">
        </a>
        {% if site.location %}
        <span class="site-location" aria-label="Location: {{ site.location }}">
          <svg class="site-location-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path fill-rule="evenodd" d="M11.54 22.351l.07.04.028.016a.76.76 0 00.723 0l.028-.015.071-.041a16.975 16.975 0 001.144-.742 19.58 19.58 0 002.683-2.282c1.944-1.99 3.963-4.98 3.963-8.827a8.25 8.25 0 00-16.5 0c0 3.846 2.02 6.837 3.963 8.827a19.58 19.58 0 002.682 2.282 16.975 16.975 0 001.145.742zM12 13.5a3 3 0 100-6 3 3 0 000 6z" clip-rule="evenodd"/></svg>
          <span class="site-location-text">{{ site.location }}</span>
        </span>
        {% endif %}
      </nav>
    </div>
  </div>
</header>
<div class="site-header-spacer" id="site-header-spacer" aria-hidden="true"></div>

<style>
.site-header {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  z-index: 100;
  width: 100%;
  background: var(--bg-surface);
  border-bottom: 1px solid var(--border-color);
}

.site-header-inner {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0.75rem 1.5rem;
  font-family: 'Satoshi', system-ui, sans-serif;
}

.site-header-left {
  display: inline-flex;
  align-items: center;
  gap: 1.25rem;
  flex: 1;
  min-width: 0;
}

/* Placeholder logo, top left */
.site-logo {
  display: inline-flex;
  align-items: center;
  text-decoration: none;
  cursor: crosshair;
  flex-shrink: 0;
}

.site-logo-mark {
  font-size: 0.9375rem;
  font-weight: 600;
  letter-spacing: 0.01em;
  color: var(--text-primary);
  text-transform: lowercase;
}

/* Search bar, beside logo */
.site-search {
  display: inline-flex;
  align-items: center;
  gap: 0.5rem;
  width: 100%;
  max-width: 18rem;
  color: var(--text-tertiary);
}

.site-search-icon {
  width: 0.9375rem;
  height: 0.9375rem;
  flex-shrink: 0;
}

.site-search-input {
  width: 100%;
  border: none;
  outline: none;
  background: transparent;
  font-family: inherit;
  font-size: 0.8125rem;
  color: var(--text-primary);
}

.site-search-input::placeholder {
  color: var(--text-tertiary);
}

/* Location, in the right icon cluster */
.site-location {
  display: inline-flex;
  align-items: center;
  gap: 0.25rem;
  color: var(--text-secondary);
}

.site-location-icon {
  width: 0.875rem;
  height: 0.875rem;
  flex-shrink: 0;
}

.site-location-text {
  font-size: 0.8125rem;
  text-transform: lowercase;
}

.site-header-right {
  display: inline-flex;
  align-items: center;
  gap: 1.125rem;
}

/* Quick-link icons, beside the menu button */
.site-header-icons {
  display: inline-flex;
  align-items: center;
  gap: 1rem;
}

.site-icon-link {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 1.25rem;
  height: 1.25rem;
  color: var(--text-secondary);
  text-decoration: none;
  cursor: crosshair;
  transition: color 0.2s, opacity 0.2s;
}

.site-theme-toggle {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 1.25rem;
  height: 1.25rem;
  padding: 0;
  border: none;
  background: transparent;
  color: var(--text-secondary);
  cursor: crosshair;
  transition: color 0.2s;
}

.site-theme-toggle:hover {
  color: var(--text-primary);
}

.site-theme-icon {
  width: 1.0625rem;
  height: 1.0625rem;
}

.site-theme-icon-moon {
  display: none;
}

:root[data-theme="dark"] .site-theme-icon-sun {
  display: none;
}

:root[data-theme="dark"] .site-theme-icon-moon {
  display: block;
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) .site-theme-icon-sun {
    display: none;
  }
  :root:not([data-theme="light"]) .site-theme-icon-moon {
    display: block;
  }
}

.site-cv-link {
  display: inline-flex;
  align-items: center;
  font-family: inherit;
  font-size: 0.8125rem;
  font-weight: 600;
  letter-spacing: 0.01em;
  color: var(--text-secondary);
  text-decoration: none;
  text-transform: lowercase;
  cursor: crosshair;
  transition: color 0.2s;
}

.site-cv-link:hover {
  color: var(--text-primary);
}

.site-icon-link .icon {
  display: inline-flex;
  font-size: 1.0625rem;
}

.site-icon-link:hover,
.site-icon-link.active {
  color: var(--text-primary);
}

.site-icon-img {
  width: 1.0625rem;
  height: 1.0625rem;
  display: block;
  opacity: 0.75;
  transition: opacity 0.2s;
}

.site-icon-link:hover .site-icon-img,
.site-icon-link.active .site-icon-img {
  opacity: 1;
}

@media (max-width: 768px) {
  .site-header-inner {
    padding: 0.625rem 1rem;
  }
  .site-logo-mark {
    font-size: 0.8125rem;
  }
  .site-header-left {
    gap: 0.75rem;
  }
  .site-search {
    max-width: none;
  }
  .site-location-text {
    display: none;
  }
  .site-header-right {
    gap: 0.75rem;
  }
  .site-header-icons {
    gap: 0.75rem;
  }
}

@media (max-width: 560px) {
  .site-search {
    display: none;
  }
}

@media (max-width: 480px) {
  .site-location-text {
    display: none;
  }
  .site-header-icons {
    gap: 0.625rem;
  }
}
</style>

<script>
(function () {
  var header = document.getElementById('site-header');
  var spacer = document.getElementById('site-header-spacer');
  if (header && spacer) {
    var syncSpacerHeight = function () {
      spacer.style.height = header.offsetHeight + 'px';
    };
    syncSpacerHeight();
    window.addEventListener('resize', syncSpacerHeight);
    if (window.ResizeObserver) {
      new ResizeObserver(syncSpacerHeight).observe(header);
    }
  }

  document.addEventListener('DOMContentLoaded', function () {
    var logoMark = document.querySelector('.site-logo-mark');
    var labeledSections = document.querySelectorAll('.gallery-strip[data-header-label]');
    var pageLabel = document.body.getAttribute('data-header-page-label');
    if (!logoMark || (!labeledSections.length && !pageLabel)) return;

    var baseLogoText = logoMark.textContent;
    var pageLogoText = pageLabel ? baseLogoText + ' / ' + pageLabel : baseLogoText;
    var updateLogoText = function () {
      if (window.innerWidth <= 768) {
        logoMark.textContent = baseLogoText;
        return;
      }
      var headerHeight = header ? header.offsetHeight : 0;
      var activeLabel = null;
      labeledSections.forEach(function (section) {
        var rect = section.getBoundingClientRect();
        if (rect.top <= headerHeight + 10 && rect.bottom > headerHeight + 10) {
          activeLabel = section.getAttribute('data-header-label');
        }
      });
      logoMark.textContent = activeLabel ? (baseLogoText + ' / ' + activeLabel) : pageLogoText;
    };
    updateLogoText();
    window.addEventListener('scroll', updateLogoText, { passive: true });
    window.addEventListener('resize', updateLogoText);
  });

  var themeToggle = document.getElementById('site-theme-toggle');
  if (themeToggle) {
    var systemPrefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
    var isDark = function () {
      var explicit = document.documentElement.getAttribute('data-theme');
      return explicit ? explicit === 'dark' : systemPrefersDark;
    };
    themeToggle.setAttribute('aria-pressed', String(isDark()));
    themeToggle.addEventListener('click', function () {
      var next = isDark() ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', next);
      try { localStorage.setItem('colorTheme', next); } catch (e) {}
      themeToggle.setAttribute('aria-pressed', String(next === 'dark'));
    });
  }

  var searchInput = document.getElementById('site-search-input');
  if (searchInput) {
    searchInput.addEventListener('input', function () {
      var query = searchInput.value.trim().toLowerCase();
      var tiles = document.querySelectorAll('.gallery-strip-tile');
      tiles.forEach(function (tile) {
        var title = (tile.getAttribute('data-gallery-title') || '').toLowerCase();
        tile.style.display = !query || title.indexOf(query) !== -1 ? '' : 'none';
      });
    });
  }

})();
</script>
