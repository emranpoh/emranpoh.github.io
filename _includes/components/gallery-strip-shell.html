{% comment %} Shared overlay markup for gallery-strip grids (used by both the publications strip and the works strip). Styles live in assets/css/_gallery-strip.scss, behavior in assets/js/gallery-strip.js. {% endcomment %}
<div class="gallery-overlay" id="gallery-overlay" aria-hidden="true" role="dialog" aria-modal="true" aria-labelledby="gallery-overlay-title">
  <div class="gallery-overlay-backdrop" id="gallery-overlay-backdrop"></div>
  <div class="gallery-overlay-content">
    <button type="button" class="gallery-overlay-close" id="gallery-overlay-close" aria-label="Close">×</button>
    <div class="gallery-overlay-image-wrap" id="gallery-overlay-image-wrap">
      <img id="gallery-overlay-image" src="" alt="" class="gallery-overlay-image">
      <video id="gallery-overlay-video" class="gallery-overlay-video" controls playsinline></video>
      <div id="gallery-overlay-pdf" class="gallery-overlay-pdf">
        <div class="gallery-overlay-pdf-pages" id="gallery-overlay-pdf-pages" role="img" aria-label="PDF preview">
          <canvas id="gallery-overlay-pdf-canvas-1" class="gallery-overlay-pdf-canvas"></canvas>
          <canvas id="gallery-overlay-pdf-canvas-2" class="gallery-overlay-pdf-canvas"></canvas>
        </div>
        <div class="gallery-overlay-pdf-controls">
          <button type="button" id="gallery-overlay-pdf-prev" class="gallery-overlay-pdf-nav" aria-label="Previous page">‹</button>
          <span id="gallery-overlay-pdf-label" class="gallery-overlay-pdf-label"></span>
          <button type="button" id="gallery-overlay-pdf-next" class="gallery-overlay-pdf-nav" aria-label="Next page">›</button>
        </div>
      </div>
      <span id="gallery-overlay-placeholder" class="gallery-overlay-placeholder">no image</span>
      <div id="gallery-overlay-image-caption" class="gallery-overlay-image-caption">
        <span id="gallery-overlay-image-caption-text" class="gallery-overlay-image-caption-text"></span>
        <span id="gallery-overlay-image-caption-dims" class="gallery-overlay-image-caption-dims"></span>
      </div>
    </div>
    <div class="gallery-overlay-resize-handle" id="gallery-overlay-resize-handle" role="separator" aria-orientation="vertical" aria-label="Resize image and text panels"></div>
    <div class="gallery-overlay-body">
      <h2 id="gallery-overlay-title" class="gallery-overlay-title"></h2>
      <div id="gallery-overlay-authors" class="gallery-overlay-authors" role="list"></div>
      <p id="gallery-overlay-venue" class="gallery-overlay-venue"></p>
      <p id="gallery-overlay-abstract" class="gallery-overlay-abstract"></p>
      <div id="gallery-overlay-links" class="gallery-overlay-links"></div>
      <a id="gallery-overlay-page-link" class="gallery-overlay-link-btn gallery-overlay-page-link" style="display: none;">view page</a>
      <div id="gallery-overlay-citation-wrap" class="gallery-overlay-citation-wrap">
        <div class="gallery-overlay-citation-head">
          <span class="gallery-overlay-citation-label">cite</span>
          <button type="button" class="gallery-overlay-copy-btn" id="gallery-overlay-copy-btn">copy</button>
        </div>
        <p id="gallery-overlay-citation" class="gallery-overlay-citation"></p>
      </div>
    </div>
  </div>
</div>

<script src="{{ '/assets/js/gallery-strip.js' | relative_url }}" defer></script>
