<header class="pub-header">
    {% if page.venue_short %}
    <p class="pub-venue-short">{{ page.venue_short }}</p>
    {% endif %}
    <h1 class="pub-title">{{ page.title }}</h1>
    <div class="pub-meta">
        <p class="pub-authors">{{ page.authors }}</p>
        <div class="pub-tags">
            {% if page.status == "under review" or page.status == "submitted" %}
            <span class="pub-tag pub-tag-status">Under Review</span>
            {% endif %}
            {% if page.doi %}
            <a href="https://doi.org/{{ page.doi }}" target="_blank" class="pub-tag pub-tag-link">
                {% include icon.html name="file-alt" %}
                DOI
            </a>
            {% endif %}
        </div>
    </div>
</header>

<style>
.pub-venue-short {
    font-size: 0.9rem;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: #6b7280;
    margin: 0 0 0.5rem;
}

.pub-title {
    font-size: 2.5rem;
    line-height: 1.2;
    margin-bottom: 1rem;
    font-weight: 700;
}

.pub-meta {
    display: flex;
    flex-direction: column;
    gap: 0.25rem;
}

.pub-authors {
    font-size: 1.25rem;
    font-weight: 350;
    color: #4a5568;
    margin: 0;
}

.pub-tags {
    display: flex;
    gap: 0.5rem;
    margin: 0;
}

.pub-tag {
    display: inline-flex;
    align-items: center;
    background-color: #f3f4f6;
    color: #718096;
    padding: 0.25rem 0.75rem;
    border-radius: 9999px;
    font-size: 0.875rem;
}

.pub-tag-status {
    background-color: #fef3c7;
    color: #b45309;
    font-weight: 500;
}

.pub-tag-link {
    text-decoration: none;
    transition: background-color 0.2s;
}

.pub-tag-link .icon {
    margin-right: 0.5rem;
}
</style>
