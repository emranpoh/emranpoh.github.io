# Welcome to Jekyll!
#
# This config file is meant for settings that affect your whole blog, values
# which you are expected to set up once and rarely edit after that. If you find
# yourself editing this file very often, consider using Jekyll's data files
# feature for the data you need to update frequently.
#
# For technical reasons, this file is *NOT* reloaded automatically when you use
# 'bundle exec jekyll serve'. If you change this file, please restart the server process.
#
# If you need help with YAML syntax, here are some quick references for you:
# https://learn-the-web.algonquindesign.ca/topics/markdown-yaml-cheat-sheet/#yaml
# https://learnxinyminutes.com/docs/yaml/
#
# Site Information
title: Emran Poh
email: emranpoh@gmail.com
work_email: emran.poh.2025@smu.edu.sg
description: >-
  CS PhD @ SMU-HAI Lab — software learning, instructional design, and human agency with AI
baseurl: ""
url: "https://emranpoh.github.io"
author: Emran Poh
name_chinese: "傅恩然"
name_arabic: "ڤوه عمران"
year: 2025
location: Singapore
profile_image: /assets/images/projects/me.jpeg
# Set to true to show the intro headshot again (me.jpeg) and the left column
# (university + email) on the research intro layout.
show_profile_photo: false

# Social Media
github_username: emranpoh
linkedin_username: emranpoh
instagram_username: emranpoh_
telegram_username: ehhhhmmmm
scholar_id: wYcrORkAAAAJ
orcid_id: 0000-0003-4721-1916
# twitter_username: jekyllrb
# linkedin_username: your-linkedin-username

# Build Settings
theme: minima
plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

# Sass Configuration
# sass_dir tells Jekyll where to find SCSS partials (default: _sass)
# Our partials are in assets/css/, so we add it to the load path
sass:
  style: :expanded
  quiet_deps: true
  sass_dir: assets/css
  silence_deprecations:
    - slash-div

# Collections
collections:
  posts:
    output: true
    permalink: /content/posts/:title/
    path: content/posts
  projects:
    output: true
    permalink: /projects/:name/
  publications:
    output: true
    permalink: /research/:title/

# Default Front Matter
defaults:
  - scope:
      path: ""
    values:
      layout: "pages/default"
  - scope:
      path: "content/index.markdown"
    values:
      layout: "pages/default"
      permalink: /
  - scope:
      path: "content/posts"
      type: "posts"
    values:
      layout: "posts/post"
  - scope:
      path: "content/projects"
      type: "projects"
    values:
      layout: "pages/project"
  - scope:
      path: "content/research"
      type: "publications"
    values:
      layout: "pages/publication"

# Exclude from processing
exclude:
  - _posts/
  - .sass-cache/
  - .jekyll-cache/
  - gemfiles/
  - Gemfile
  - Gemfile.lock
  - node_modules/
  - vendor/
  - .git/
  - .gitignore
  - README.md
