<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="google-site-verification" content="_SkyeQz8QnWuiacmJ5NwERPqONMd7w2CJG" />
  {% seo %}
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://unpkg.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@100..900&family=Hanken+Grotesk:ital,wght@0,100..900;1,100..900&display=swap">
  <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">
  <script>
    // Check for saved theme preference
    const savedTheme = localStorage.getItem('viewMode');
    if (savedTheme === 'research') {
      document.documentElement.classList.add('research-theme');
    }
  </script>
</head>
<body class="layout-masonry layout-sidebar">
  {% include components/sidebar.html %}
  <div class="desktop-wrapper">
    <div class="main-column">
      <main class="content content-{{ page.id | default: page.title | replace: ' ', '-' | slice: 0, 5 }}" id="main-content">
        {{ content }}
      </main>
    </div>
    
    <footer class="footer">
      <p>&copy; {{ 'now' | date: '%Y' }} {{ site.title | downcase }}</p>
    </footer>
  </div>

  <script>
    // Scrollbar visibility control
    let scrollTimeout;
    document.addEventListener('scroll', function() {
      document.body.classList.add('scrolling');
      // Also add scrolling class to content elements
      const contentElements = document.querySelectorAll('.content');
      
      contentElements.forEach(content => {
        content.classList.add('scrolling');
      });
      
      clearTimeout(scrollTimeout);
      scrollTimeout = setTimeout(function() {
        document.body.classList.remove('scrolling');
        contentElements.forEach(content => {
          content.classList.remove('scrolling');
        });
      }, 1000);
    });

    // Enhanced smooth scrolling for all scrollable elements
    function smoothScrollTo(element, target, duration = 300) {
      const start = element.scrollTop;
      const change = target - start;
      const startTime = performance.now();

      function animateScroll(currentTime) {
        const elapsed = currentTime - startTime;
        const progress = Math.min(elapsed / duration, 1);
        const ease = progress < 0.5 ? 2 * progress * progress : 1 - Math.pow(-2 * progress + 2, 3) / 2;
        
        element.scrollTop = start + change * ease;
        
        if (progress < 1) {
          requestAnimationFrame(animateScroll);
        }
      }
      
      requestAnimationFrame(animateScroll);
    }

    // Apply smooth scrolling to all scrollable containers
    document.addEventListener('DOMContentLoaded', function() {
      const scrollableElements = document.querySelectorAll('.content, .pubs-list');
      scrollableElements.forEach(element => {
        element.style.scrollBehavior = 'smooth';
      });
    });
  </script>
  <script src="https://unpkg.com/masonry-layout@4/dist/masonry.pkgd.min.js" defer></script>
  <script src="{{ '/assets/js/image-contrast.js' | relative_url }}" defer></script>
  <script src="{{ '/assets/js/placeholder-svg.js' | relative_url }}" defer></script>
</body>
</html>
