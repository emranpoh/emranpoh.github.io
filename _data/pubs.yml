- title: "When Not to Help: A Human-Teaching Lens on AI Tutoring"
  gallery_order: 3
  title_short: "When Not to Help"
  authors: "Emran Poh"
  type: "Workshop Paper"
  venue: "CHI 2026 Workshop: Understanding and Engaging Critical Resistance to AI in Education"
  venue_short: "CHI 26 Workshops"
  workshop_name: "Understanding and Engaging Critical Resistance to AI in Education"
  location: "Barcelona, Spain"
  date: "April 13–17, 2026"
  year: 2026
  sort_key: "202604"
  status: "accepted"
  status_note: "under revision"
  institution: "smuhci"
  image: ""
  thumbnail: "when-not-to-help.webp"
  image_natural: true
  is-selected: false
  emoji: "📚"
  url: "/research/when-not-to-help"
  bib: ""
  tags:
    - name: "pdf"
      url: "/assets/pdfs/when-not-to-help.pdf"
  abstract: "We invert the usual question about GenAI in education: rather than ask how to deploy new capabilities, we ask what role GenAI should play given what we know about effective human teaching. This position draws on an observational study of ten teacher-student pairs using speech, visual annotations, and remote screen control to teach Figma to novices. Teachers consistently showed restraint—avoiding high-precision modalities when it would undermine learning—which we interpret as pedagogical wisdom, not inefficiency. We argue this reveals a precision-agency tradeoff and digital territoriality as design constraints for GenAI tutors. We contribute empirical evidence of how teachers balance help with learner agency, methodological guidance for evaluation under authentic motivation, and implications for metrics and design process that treat restraint and friction as valid design goals."
  abstract_short: "We flip the usual question from how to ship GenAI tutors to what role they should play given how effective human teachers withhold intrusive help to protect agency. Grounded in observational Figma tutoring, we argue restraint and friction can be virtues and outline evaluation and design implications for AI systems in education."
  citation: |
    Emran Poh. 2026. When Not to Help: A Human-Teaching Lens on AI Tutoring. In CHI 2026 Workshop: Understanding and Engaging Critical Resistance to AI in Education, April 13–17, 2026, Barcelona, Spain.
