- title: "Not Too Early, Not All at Once: Design Tensions in AI-Mediated Self-Disclosure in Online Dating"
  gallery_order: 5
  title_short: "Not Too Early, Not All at Once"
  authors: "Pei-Hua Tsai, Tianyi Zhang, Emran Poh, Anthony Tang, and Yung-Ju Chang"
  type: "Full Paper"
  venue: "2026 ACM Conference on Designing Interactive Systems (DIS '26)"
  venue_short: "DIS 26 Papers"
  year: 2026
  sort_key: "202606"
  status: "published"
  institution: "smuhci"
  image: "not-too-early.webp"
  image_caption: "Figure 1: AI mediation provocations for the pacing scenario, varied by perspective (user behavior vs. partner experience) and delivery mode (public vs. private)"
  extra_images:
    - image: "not-too-early-authors-group-photo.webp"
      caption: "With fellow attendees at DIS 2026"
  is-selected: false
  emoji: "💬"
  url: "/research/not-too-early-ai-mediated-self-disclosure"
  doi: "10.1145/3800645.3812961"
  bib: ""
  tags:
    - name: "doi"
      url: "https://doi.org/10.1145/3800645.3812961"
    - name: "repository"
      url: "https://ink.library.smu.edu.sg/sis_research/11137"
  abstract: "Online dating relies on self-disclosure, yet initial conversations are fragile: users must navigate uncertainty around timing, boundaries, and reciprocity with little shared context. While advances in AI raise the possibility of mediating disclosure, how such support might reshape the experience of early-stage relational disclosure remains underexplored. We conducted 29 semi-structured interviews to examine how daters envision AI-mediated self-disclosure in online dating. Our findings surface recurring design tensions rather than simple opportunities or risks. Participants welcomed guidance that could pace disclosure, support reflection, and reduce social awkwardness, but stressed preserving agency and authorship. They valued interpretive assistance for sense-making of ambiguous partner cues, yet worried that algorithmic interpretation might foreclose gradual discovery. Participants also described relational buffering as face-saving, while cautioning that increased efficiency risks undermining reciprocity, surprise, and co-constructed intimacy. Together, these findings suggest that designing AI for intimate contexts requires attending to how support redistributes agency, interpretation, and participation over time, rather than treating disclosure as an optimization problem."
  abstract_short: "We study design tensions when AI systems mediate self-disclosure in online dating, focusing on pacing and initiation so technology supports rather than rushes intimacy. The work reframes timing and granularity of automated prompts as core interaction design problems for relationship-seeking contexts."
  citation: |
    Pei-Hua Tsai, Tianyi Zhang, Emran Poh, Anthony Tang, and Yung-Ju Chang. 2026. Not Too Early, Not All at Once: Design Tensions in AI-Mediated Self-Disclosure in Online Dating. In Designing Interactive Systems Conference (DIS '26), June 13–17, 2026, Singapore, Singapore. ACM, New York, NY, USA. https://doi.org/10.1145/3800645.3812961
