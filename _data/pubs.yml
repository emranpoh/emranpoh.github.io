  abstract: "This demo presents a virtual reality (VR) environment developed for evaluating signalized and unsignalized intersection scenarios using low cost head-mounted devices (HMD). Prior work focused on VR simulations that re-create less complex scenarios for the evaluation of different autonomous vehicle (AV) behavior and external human-machine interfaces (eHMIs). The proposed VR environment allows participants to walk across multiple road lanes, and experience and interact with high fidelity simulated traffic scenarios, including signalized and unsignalized intersections at 1:1 scale, with vehicular traffic making turns, and providing audio feedback. This simulation can be used for conducting user studies to test AV eHMIs or behavior interventions with participants."
  abstract_short: "IntVRsection is a VR environment for pedestrian-focused studies at signalized and unsignalized intersections at roughly life scale with surrounding traffic. It enables safer, repeatable evaluations of autonomous-vehicle behaviors and external HMIs than simpler desktop or abstract scenarios alone."
