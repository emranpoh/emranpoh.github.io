  bib: "@INPROCEEDINGS{10322229,\n  author={Poh, Emran and Tang, Anthony and Lee, Jeannie S. and Shengdong, Zhao},\n  booktitle={2023 IEEE International Symposium on Mixed and Augmented Reality Adjunct (ISMAR-Adjunct)}, \n  title={Supporting Artefact Awareness in Partially-Replicated Workspaces}, \n  year={2023},\n  volume={},\n  number={},\n  pages={55-59},\n  keywords={Human computer interaction;Social computing;Collaboration;X reality;Human-centered computing Collaborative and social computing theory;concepts and paradigms;H;uman-centered computing Computer supported cooperative work;Human-centered computing Computer supported cooperative work;Human-centered computing Interaction design},\n  doi={10.1109/ISMAR-Adjunct60411.2023.00019}\n}"
  abstract: "Using Cross Reality (CR) approaches for remote collaboration will often result in partially-replicated workspaces. Here, workspace artefacts are not equally accessible—i.e. a physical artefact may only be manipulated by one collaborator—and in general, the artefacts become desynchronised over time. In this paper, we introduce a framework for artefact awareness that can help collaborators maintain an understanding of each others' manipulations with workspace artefacts. We illustrate our design explorations through sketches, and outline how we aim to study the effectiveness and utility of artefact awareness in cross reality remote collaboration. In our work, we expect to show that effectively supporting artefact awareness will help make cross-reality remote collaboration smoother."
  abstract_short: "Cross-reality remote collaboration often yields partially replicated workspaces where artefacts drift out of sync across sites and collaborators lose mutual visibility of manipulations. We outline artefact awareness support so teams retain shared understanding of objects and changes despite asymmetric physical access."
  citation: |
    Emran Poh, Anthony Tang, Jeannie S. Lee, and Zhao Shengdong. 2023. Supporting Artefact Awareness in Partially-Replicated Workspaces. In 2023 IEEE International Symposium on Mixed and Augmented Reality Adjunct (ISMAR-Adjunct), October 16–20, 2023, Sydney, Australia. 55–59. https://doi.org/10.1109/ISMAR-Adjunct60411.2023.00019
