- title: "'Desire Paths' in AI-Guided Software Learning"
  title_short: "Desire Paths in AI-Guided Software Learning"
  authors: "Emran Poh"
  type: "Position Paper"
  venue: "CHI 2026 Workshop: Human-AI-UI Interactions Across Modalities"
  venue_short: "CHI 26 Workshops"
  workshop_name: "Human-AI-UI Interactions Across Modalities"
  location: "Barcelona, Spain"
  date: "April 13–17, 2026"
  year: 2026
  sort_key: "202604"
  status: "accepted"
  institution: "smuhci"
  image: ""
  thumbnail: "desire-paths-workshop.webp"
  image_natural: true
  is-selected: false
  emoji: "🛤️"
  url: "/research/desire-paths-in-learning"
  doi: ""
  bib: ""
  abstract: "Learners who deviate from prescribed instructional paths are not necessarily failing—they may be revealing signal about themselves, the curriculum, and the interface. Yet AI tutoring agents for software learning typically treat deviation as error to be corrected. We argue this framing is fundamentally misaligned with how learning actually unfolds. Drawing on the urban planning concept of desire paths—informal trails that emerge when pedestrians route around formal walkways—we reframe learner deviations as meaningful signals of unmet needs, prior knowledge, and curriculum gaps. We ground this argument in an empirical study of human software tutors teaching Figma, which reveals that expert tutors already read and respond to desire paths by fluidly shifting across instructional modalities—speech, visual annotation, and remote screen control—in response to learner behavior. We offer a preliminary taxonomy of deviation types, argue that the Human↔Agent↔UI triangle in learning contexts must be redesigned around negotiated path-finding rather than path enforcement, and argue that the field needs frameworks and empirical study of adaptive multimodal intervention design for tutoring systems to make this negotiation possible."
  abstract_short: "We borrow the idea of desire paths to reframe learner deviation in software training as informative signal—not error to stamp out—about needs, prior knowledge, and curriculum fit. Evidence from human Figma tutors shows experts already negotiate paths by shifting speech, annotation, and remote control rather than enforcing one rigid route."
  citation: |
    Emran Poh. 2026. 'Desire Paths' in AI-Guided Software Learning. In CHI 2026 Workshop: Human-AI-UI Interactions Across Modalities, April 13–17, 2026, Barcelona, Spain.
  tags:
    - name: "pdf"
      url: "/assets/pdfs/desire-paths.pdf"
