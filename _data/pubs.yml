- title: "'Show It, Don't Just Say It': The Complementary Effects of Instruction Multimodality for Software Guidance"
  title_short: "Show It, Don't Just Say It"
  authors: "Emran Poh, Yueyue Hou, Tianyi Zhang, and Jiannan Li"
  type: "Full Paper"
  venue: "2026 ACM Conference on Human Factors in Computing Systems (CHI '26)"
  venue_short: "CHI 26 Papers"
  location: "Barcelona, Spain"
  date: "April 13–17, 2026"
  year: 2026
  sort_key: "202604"
  status: "published"
  acceptance:
    accepted: 1705
    total: 6730
  institution: "smuhci"
  image: "showit.webp"
  image_caption: "Sketch of the two-person study setup for evaluating software guidance instructions"
  is-selected: true
  emoji: "📝"
  url: "/research/show-it-software-guidance"
  doi: "10.1145/3772318.3791200"
  bib: ""
  tags:
    - name: "doi"
      url: "https://dl.acm.org/doi/full/10.1145/3772318.3791200"
    - name: "program"
      url: "https://programs.sigchi.org/chi/2026/program/content/223481"
  abstract: "Designing adaptive tutoring systems for software learning presents challenges in determining appropriate instructional modalities. To inform the design of such systems, we conducted an observational study of ten human teacher-student pairs (N=10), where experienced design software users taught novices two new graphic design software features through multi-step procedures. These lessons were limited to three communication channels (speech, visual annotations, and remote screen control) to mimic possible AI tutor modalities. We found that annotations complement speech with spatial precision and remote control complements it with spatial and temporal precision, but both cause intrusion to learner agency. Teachers adaptively select modalities to balance the need for instruction progress with students’ cognitive engagement and sense of digital territory ownership. Our results provide further support to the contiguity principles and the value of agency in learning, while suggesting precision-agency trade-off and digital territoriality as new design constraints for adaptive software guidance."
  abstract_short: "In an observational study of expert–novice graphic design tutoring, speech, annotations, and remote control each trade precision for learner agency and sense of control over the shared workspace. Teachers mix modalities adaptively, supporting contiguity principles while motivating precision–agency trade-offs and digital territoriality as design constraints for adaptive software guidance."
  citation: |
    Emran Poh, Yueyue Hou, Tianyi Zhang, and Jiannan Li. 2026. 'Show It, Don't Just Say It': The Complementary Effects of Instruction Multimodality for Software Guidance. In Proceedings of the 2026 CHI Conference on Human Factors in Computing Systems (CHI '26), April 13–17, 2026, Barcelona, Spain. ACM, New York, NY, USA, 18 pages. https://doi.org/10.1145/3772318.3791200
  work-tags:
