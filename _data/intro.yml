# Intro split: current, past
current:
  - "I'm a Ph.D. student in human-computer interaction at Singapore Management University's [SMU-HCI](https://smuhci.com/), advised by [Li Jiannan](https://jchrisli.github.io/)."

past:
  - "I hold an MComp from NUS, advised by [Zhao Shengdong](https://shengdongzhao.com/) and [Tony Tang](https://hcitang.github.io/), and a BSc (Hons) in Computing Science from University of Glasgow, under [Jeannie Lee](https://www.singaporetech.edu.sg/directory/faculty/jeannie-lee)."

research:
  - "My research examines what happens when AI moves from supporting work to participating in it. I study how agents that interpret goals, coordinate activity, and act on people's behalf redistribute discretion across workers, teams, and systems."
  - "I am interested in whose preferences these agents enact, what they make visible or obscure, and how they reshape judgment, responsibility, relationships, and the values through which people make sense of their work."

teaching:
  - "I **teach** interaction design and programming courses, and enjoy sharing knowledge with students and professionals. I am particularly interested in AI Tutor design to enhance learning experiences through intelligent human-agent collaboration."

others:
  - "I enjoy building and occasionally crashing interplanetary rockets in Kerbal Space Program 🚀 and creating unnecessarily complicated factory designs in Factorio 🔧"

