paragraphs:
  - "Emran Poh is a **researcher and designer** from Singapore who studies and builds tools for intelligent human-agent collaboration, working across <mark>Expressive AI for Learning</mark> and `Intent Programming`."
  - "He is working on his Ph.D. in Computer Science at Singapore Management University, as part of the amazing [SMU-HCI](https://smuhci.com/) community, advised by [Li Jiannan](https://jchrisli.github.io/)."
  - "He enjoys building and occasionally crashing interplanetary rockets in Kerbal Space Program 🚀 and creating unnecessarily complicated factory designs in Factorio 🔧"

