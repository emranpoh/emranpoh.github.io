paragraphs:
  - "I am a **researcher and designer** from 🇸🇬 Singapore who studies and builds tools for intelligent human-agent collaboration. My work sits at the intersection of human-computer interaction and artificial intelligence, with a focus on <mark>human creativity</mark> and <mark>learning</mark>. I am passionate about helping humans be more expressive and authentic through the tools I create."
  - "I'm currently pursuing my Ph.D. in Computer Science at Singapore Management University, working on human-agent interactions with [Li Jiannan](https://jchrisli.github.io/) as part of the [SMU-HCI](https://smuhci.com/) community. Before my Ph.D., I was a Research Engineer at SMU with Li Jiannan and at Singapore Institute of Technology with [Jeannie Lee](https://www.gla.ac.uk/schools/computing/staff/jeanniele/) and [Kyrin Liong](https://www.singaporetech.edu.sg/directory/faculty/kyrin-liong-yushan). I completed my Master of Computing at National University of Singapore working with [Zhao Shengdong](https://shengdongzhao.com/) and [Tony Tang](https://hcitang.github.io/), and my BSc (Hons) in Computing Science from University of Glasgow under Jeannie Lee's supervision."
  - "Beyond research, I also teach interaction design and programming courses, and enjoy sharing knowledge with students and professionals. I am particularly interested in AI Tutor design to enhance learning experiences through intelligent human-agent collaboration."
  - "I enjoy building and occasionally crashing interplanetary rockets in Kerbal Space Program 🚀 and creating unnecessarily complicated factory designs in Factorio 🔧"

research:
  - "<mark>Expressive AI for Learning</mark> exploring how AI systems can be designed to be more expressive, interpretable, and pedagogically effective in educational contexts. This includes developing AI interfaces that help learners understand AI behavior and reasoning processes."
  - "<mark>Intent Programming for Children</mark> designing programming languages and interfaces that allow children to express their creative intentions without getting bogged down by syntax. Focusing on making programming more accessible and intuitive for young learners."

