paragraphs:
  - "Emran Poh is a **researcher and designer** from 🇸🇬 Singapore who studies and builds tools for intelligent human-agent collaboration. His work sits at the intersection of human-computer interaction and artificial intelligence, focusing on <mark>Expressive AI for Learning</mark> (making AI expressive enough for learning and educational contexts) and `Intent Programming for Children`."
  - "He is working on his Ph.D. in Computer Science at Singapore Management University, as part of the amazing [SMU-HCI<i class=\"fas fa-external-link-alt\"></i>](https://smuhci.com/) community, advised by [Li Jiannan<i class=\"fas fa-external-link-alt\"></i>](https://jchrisli.github.io/). He also teaches interaction design and programming courses, and enjoys sharing knowledge with students and professionals."
  - "He enjoys building and occasionally crashing interplanetary rockets in Kerbal Space Program 🚀 and creating unnecessarily complicated factory designs in Factorio 🔧"

