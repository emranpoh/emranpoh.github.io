# Intro split: current, past
current:
  - "I'm a Ph.D. student at Singapore Management University, working on human-computer interaction with [Prof. Li Jiannan](https://jchrisli.github.io/) as part of the [SMU-HCI](https://smuhci.com/) community."

past:
  - "I completed my Master of Computing at National University of Singapore working with [Prof. Zhao Shengdong](https://shengdongzhao.com/) and [Prof. Tony Tang](https://hcitang.github.io/)."
  - "BSc (Hons) in Computing Science from University of Glasgow under Prof. Jeannie Lee's supervision."

research:
  - "My research sits at the intersection of human–computer interaction, instructional design, and AI systems — broadly concerned with how people learn software and how AI can support that learning without undermining the learner's own agency. I build systems, run studies, and develop frameworks around when precise guidance helps versus when it substitutes for the learner, including ideas like the **precision–agency trade-off** and **digital territoriality** in shared workspaces."
  - "Looking ahead, I am extending this focus into **collaborative and agentic** settings: when AI agents act on behalf of people in shared workspaces, joint decision-making, and coordinated tasks. I am interested in whose preferences an agent serves, what it surfaces or obscures, and how accountability, trust, and design can help humans remain meaningfully in control as agents take on more of the work."

teaching:
  - "I **teach** interaction design and programming courses, and enjoy sharing knowledge with students and professionals. I am particularly interested in AI Tutor design to enhance learning experiences through intelligent human-agent collaboration."

others:
  - "I enjoy building and occasionally crashing interplanetary rockets in Kerbal Space Program 🚀 and creating unnecessarily complicated factory designs in Factorio 🔧"

