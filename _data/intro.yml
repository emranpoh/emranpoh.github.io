paragraphs:
  - "**CS PhD Student**"
  - "I'm currently pursuing my Ph.D. in Computer Science at Singapore Management University, working on human-agent interactions with [Li Jiannan](https://jchrisli.github.io/) as part of the [SMU-HCI](https://smuhci.com/) community. I completed my Master of Computing at National University of Singapore working with [Zhao Shengdong](https://shengdongzhao.com/) and [Tony Tang](https://hcitang.github.io/), and my BSc (Hons) in Computing Science from University of Glasgow under Jeannie Lee's supervision."

