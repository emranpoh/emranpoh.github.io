    title: "Paper accepted to CHI 2026 Workshop: 'When Not to Help: A Human-Teaching Lens on AI Tutoring'"
    date: "2026-02-24"
    category: "Publication"
    location: "Barcelona, Spain"
    tags: ["chi", "publication", "hci", "ai education", "workshop"]
    featured: true
    type: "publication"
    institution: "acm"
    summary: "Our paper on when AI tutors should (and shouldn't) help, from a human-teaching perspective, was accepted to the CHI 2026 workshop on Understanding and Engaging Critical Resistance to AI in Education."
    content: |
      Paper accepted to the CHI 2026 workshop on Understanding and Engaging Critical Resistance to AI in Education. We draw on human-teaching literature to think about when AI tutoring systems should hold back from helping — and why that matters for learning.

